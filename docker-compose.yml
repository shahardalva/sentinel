# Local dev stack. Use the Makefile, or run compose directly:
#
#   real upstream:  docker compose up -d --build
#   mock upstream:  docker compose -f docker-compose.yml -f docker-compose.mock.yml --profile mock up -d --build
#
# The mock run needs certificates first: go run ./cmd/devcerts (make certs),
# and SENTINEL_ADMIN_TOKEN in .env: its gateway takes client keys from the
# postgres service, managed through the admin API (http://127.0.0.1:9465).
# Both runs include Prometheus and Grafana (http://127.0.0.1:3000).

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# The whole ./certs directory, server key included. Only certs-init and
# mockupstream mount it.
x-certs: &certs
  type: bind
  source: ./certs
  target: /certs
  read_only: true
  bind:
    # Fail instead of creating an empty, root-owned ./certs on the host.
    create_host_path: false

# Just the dev CA certificate, for clients of mockupstream.
x-ca: &ca
  type: bind
  source: ./certs/ca.pem
  target: /certs/ca.pem
  read_only: true
  bind:
    create_host_path: false

services:
  gateway:
    build:
      context: .
      target: gateway
    image: sentinel-gateway:dev
    <<: *hardening
    env_file:
      - path: .env
        required: true
    environment:
      # Listen on all interfaces inside the container; the host port below
      # is bound to loopback only.
      SENTINEL_ADDR: 0.0.0.0:8081
      # Which upstreams to serve, from .env; Anthropic only by default.
      # Each one listed needs its key in .env, and a custom one its
      # SENTINEL_UPSTREAM_<NAME>_* variables, which reach the container
      # through env_file.
      SENTINEL_UPSTREAMS: ${SENTINEL_UPSTREAMS:-anthropic}
      # Per-key rate limiting. SENTINEL_RATE_LIMIT_RPM and
      # SENTINEL_RATE_LIMIT_FAIL_MODE can be set in .env.
      SENTINEL_REDIS_URL: redis://redis:6379/0
      # Metrics on all interfaces inside the container, for Prometheus on
      # the compose network. Not published on the host.
      SENTINEL_METRICS_ADDR: 0.0.0.0:9464
      # .env holds these for the mock run's gateway, which has a database
      # and an admin API (docker-compose.mock.yml sets them again). This
      # gateway has neither: blank, so the admin token never reaches its
      # container and nothing logs them as set but ignored. environment
      # overrides env_file.
      SENTINEL_ADMIN_TOKEN: ""
      SENTINEL_KEYS_REFRESH: ""
      SENTINEL_KEYS_MAX_STALE: ""
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Copies the server key from the bind-mounted ./certs into a volume, owned
  # by the mockupstream user and readable only by it. devcerts writes the
  # key 0600 for the host user, so on Linux the container's nonroot user
  # can't read the bind-mounted file directly; on Docker Desktop the mount
  # shows other owners and modes. The copy works the same on both.
  certs-init:
    image: alpine:3.22
    profiles: [mock]
    <<: *hardening
    cap_add: [CHOWN, DAC_OVERRIDE]
    user: "0:0"
    volumes:
      - *certs
      - mockupstream-key:/key
    command:
      - sh
      - -euc
      - |
        rm -f /key/server-key.pem
        cp /certs/server-key.pem /key/server-key.pem
        chmod 0400 /key/server-key.pem
        chown 65532:65532 /key/server-key.pem

  mockupstream:
    build:
      context: .
      target: mockupstream
    image: sentinel-mockupstream:dev
    profiles: [mock]
    <<: *hardening
    command:
      - -addr=0.0.0.0:9090
      # 100ms, not the 200ms default, as in bench/RESULTS.md: about 100
      # requests in flight at 1000 req/s, under the gateway's cap of 128.
      - -delay=100ms
      - -tls-cert=/certs/server.pem
      - -tls-key=/key/server-key.pem
    volumes:
      - *certs
      - mockupstream-key:/key:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # The gateway for make bench-gateway. All of its upstreams always point
  # at mockupstream, it holds only dummy upstream keys, and it reads nothing
  # from .env except BENCH_API_KEY, so a load test can never reach a real
  # API; make bench-gateway checks the base URLs it logs before k6 starts.
  # mockcompat is a custom upstream on the mock's OpenAI API, for
  # BENCH_UPSTREAM=mockcompat. Not published on the host. It rate limits
  # through Redis like the real gateway, so the bench measures the Redis
  # call, but with a limit no bench reaches, so it never sees a 429.
  gateway-bench:
    build:
      context: .
      target: gateway
    image: sentinel-gateway:dev
    profiles: [bench]
    <<: *hardening
    environment:
      SENTINEL_ADDR: 0.0.0.0:8081
      SENTINEL_UPSTREAMS: anthropic,openai,mockcompat
      ANTHROPIC_BASE_URL: https://mockupstream:9090
      ANTHROPIC_API_KEY: mock-not-a-real-key
      OPENAI_BASE_URL: https://mockupstream:9090/v1
      OPENAI_API_KEY: mock-not-a-real-key
      SENTINEL_UPSTREAM_MOCKCOMPAT_PROTOCOL: openai
      SENTINEL_UPSTREAM_MOCKCOMPAT_BASE_URL: https://mockupstream:9090/v1
      SENTINEL_UPSTREAM_MOCKCOMPAT_API_KEY: mock-not-a-real-key
      SENTINEL_UPSTREAM_CA_FILE: /certs/ca.pem
      SENTINEL_API_KEYS: ${BENCH_API_KEY:-bench}
      # Database 1, apart from the gateway's buckets in database 0.
      SENTINEL_REDIS_URL: redis://redis:6379/1
      SENTINEL_RATE_LIMIT_RPM: "1000000"
      SENTINEL_METRICS_ADDR: 0.0.0.0:9464
    volumes:
      - *ca
    depends_on:
      mockupstream:
        condition: service_started
      redis:
        condition: service_healthy

  # Tenants and client keys for the gateway of the mock run
  # (docker-compose.mock.yml), managed through its admin API. Not published
  # on the host: only the gateway reaches it, on the compose network.
  #
  # The password is a dev-only default, not a secret: it is in this file,
  # the gateway's SENTINEL_DATABASE_URL repeats it, and it is set only when
  # the volume is first initialized (changing it later needs ALTER ROLE or
  # make down and docker volume rm on sentinel_postgres-data). Never use
  # this service, or this password, for anything but local development.
  postgres:
    image: postgres:18.6-alpine3.24
    profiles: [mock]
    <<: *hardening
    # The image's own postgres user (uid 70 on Alpine), so the entrypoint
    # needs no capability. Started as root it would chown the data
    # directory and drop to postgres with su-exec, which needs CHOWN,
    # DAC_OVERRIDE, FOWNER, SETUID and SETGID. The image ships the data
    # directory owned by postgres, and a new volume copies that.
    user: postgres
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_DB: sentinel
      POSTGRES_PASSWORD: sentinel-dev-only
    tmpfs:
      # The socket and lock file directory, and scratch space: the root
      # filesystem is read-only.
      - /var/run/postgresql
      - /tmp
    volumes:
      # Postgres 18 images keep PGDATA in /var/lib/postgresql/18/docker and
      # declare the volume one level up, at /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: while the entrypoint initializes a new volume, its
      # temporary server listens on the unix socket alone, so this passes
      # only once the real server accepts the gateway's connections.
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-U", "sentinel", "-d", "sentinel"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Rate-limit buckets for the gateway. Not published on the host.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Scrapes gateway:9464 and gateway-bench:9464 on the compose network
  # (observability/prometheus/prometheus.yml). Not published on the host;
  # Grafana is the way in. Runs as nobody and writes only its data volume.
  prometheus:
    image: prom/prometheus:v3.15.1
    <<: *hardening
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - type: bind
        source: ./observability/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
      - prometheus-data:/prometheus
    restart: unless-stopped

  # Local dev only: anyone who can reach 127.0.0.1:3000 sees the dashboards
  # as an anonymous Viewer. No admin account is created, and the login form
  # and basic auth are off, so there is no password anywhere. The data
  # source and the dashboard are provisioned from ./observability.
  # Settings: https://grafana.com/docs/grafana/v13.2/setup-grafana/configure-grafana/
  grafana:
    image: grafana/grafana:13.2.4
    <<: *hardening
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Applies to an empty grafana-data volume; an existing one keeps the
      # admin it already has until the volume is removed.
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/sentinel.json
      # No code fetched at runtime. By default Grafana downloads and updates
      # its "preinstalled" plugins (the Prometheus data source among them)
      # from grafana.com in the background. A pinned image must run the
      # plugins it shipped with; the read-only root exposed this when an
      # update tried to replace the bundled Prometheus plugin and left none.
      # The image's copies in data/plugins-bundled still load.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      # The embedded signing key verifies plugins; don't download a new one.
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      # With these, every outbound feature the 13.2 configuration reference
      # lists is off: usage stats, update checks, the news feed, Gravatar,
      # external snapshots, plugin installs and key downloads. Not verified
      # by watching traffic. The UI still links to grafana.com docs, which
      # the browser follows only if clicked.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      # Console only: the root filesystem is read-only.
      GF_LOG_MODE: console
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ./observability/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./observability/grafana/dashboards
        target: /etc/grafana/dashboards
        read_only: true
        bind:
          create_host_path: false
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  # Load test runner for make bench / make bench-gateway. Verifies the
  # mock's certificate against the dev CA.
  k6:
    image: grafana/k6:1.3.0
    profiles: [bench]
    environment:
      SSL_CERT_FILE: /certs/ca.pem
      TARGET_URL: ${TARGET_URL:-https://mockupstream:9090}
      API_KEY: ${BENCH_API_KEY:-bench}
      BENCH_API: ${BENCH_API:-anthropic}
      BENCH_UPSTREAM: ${BENCH_UPSTREAM:-}
      STREAM: ${STREAM:-}
      DURATION_S: ${DURATION_S:-30}
    volumes:
      - *ca
      - type: bind
        source: ./bench/k6
        target: /scripts
        read_only: true
    command: ["run", "/scripts/messages.js"]

  # k6 for make bench-gateway, which runs it twice. First messages.js, with
  # K6_SUMMARY_EXPORT writing k6's summary into its working directory, the
  # k6-out volume. Then, with BENCH_K6_SCRIPT=gateway-verdict.js, a script
  # that prints that summary and gateway-bench's /metrics, fetched here on
  # the compose network, for cmd/benchverdict. The volume is mounted on
  # /home/k6, which the image owns as the k6 user: a new named volume takes
  # the ownership of the directory it is mounted on, so k6 can write to it.
  # The script name is interpolated rather than passed as an argument,
  # since Git Bash rewrites an argument that starts with "/".
  k6-gateway:
    extends:
      service: k6
    profiles: [bench]
    volumes:
      - k6-out:/home/k6
    command: ["run", "/scripts/${BENCH_K6_SCRIPT:-messages.js}"]

volumes:
  k6-out:
  mockupstream-key:
  postgres-data:
  prometheus-data:
  grafana-data:
