name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Runs the rate-limit script on real Redis as well as miniredis.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...
        env:
          SENTINEL_TEST_REDIS_URL: redis://localhost:6379/0

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Dockerfile Go version matches go.mod
        run: |
          gomod="$(awk '$1 == "go" {print $2}' go.mod)"
          dockerfile="$(sed -n 's/^ARG GO_VERSION=//p' Dockerfile)"
          if [ "$gomod" != "$dockerfile" ]; then
            echo "go.mod has go $gomod, Dockerfile has GO_VERSION=$dockerfile"
            exit 1
          fi

      - name: Compose files are valid
        run: |
          cp .env.example .env
          mkdir certs
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.mock.yml --profile mock config --quiet

      - name: Build images
        run: |
          docker build --target gateway -t sentinel-gateway:ci .
          docker build --target mockupstream -t sentinel-mockupstream:ci .
