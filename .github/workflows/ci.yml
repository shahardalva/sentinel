name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Runs the rate-limit script on real Redis as well as miniredis, and
    # the store tests on real Postgres (same image as make test-postgres).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_PASSWORD: sentinel-test-only
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...
        env:
          SENTINEL_TEST_REDIS_URL: redis://localhost:6379/0
          SENTINEL_TEST_POSTGRES_URL: postgres://postgres:sentinel-test-only@localhost:5432/sentinel_test?sslmode=disable

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Dockerfile Go version matches go.mod
        run: |
          gomod="$(awk '$1 == "go" {print $2}' go.mod)"
          dockerfile="$(sed -n 's/^ARG GO_VERSION=//p' Dockerfile)"
          if [ "$gomod" != "$dockerfile" ]; then
            echo "go.mod has go $gomod, Dockerfile has GO_VERSION=$dockerfile"
            exit 1
          fi

      - name: Compose files are valid
        run: |
          cp .env.example .env
          mkdir certs
          docker compose config --quiet
          # The mock gateway's admin token has no default: without one in
          # .env (empty in .env.example) the mock files must not load.
          if docker compose -f docker-compose.yml -f docker-compose.mock.yml --profile mock config --quiet 2>/dev/null; then
            echo "docker-compose.mock.yml loaded without SENTINEL_ADMIN_TOKEN"
            exit 1
          fi
          SENTINEL_ADMIN_TOKEN=ci-config-check-only-not-a-real-token \
            docker compose -f docker-compose.yml -f docker-compose.mock.yml --profile mock config --quiet

      - name: Build images
        run: |
          docker build --target gateway -t sentinel-gateway:ci .
          docker build --target mockupstream -t sentinel-mockupstream:ci .
