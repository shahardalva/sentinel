# Points the gateway at the mockupstream service over HTTPS, with client
# keys from the postgres service and the admin API on 127.0.0.1:9465.
# Needs SENTINEL_ADMIN_TOKEN in .env. Use with the mock profile:
#
#   docker compose -f docker-compose.yml -f docker-compose.mock.yml --profile mock up -d --build

services:
  gateway:
    environment:
      # Both protocols, both served by the mock, plus a custom upstream on
      # the mock's OpenAI API for the prefixed route
      # /mockcompat/v1/chat/completions. Custom upstreams from .env are
      # not listed, so the gateway warns about them and doesn't use them.
      SENTINEL_UPSTREAMS: anthropic,openai,mockcompat
      ANTHROPIC_BASE_URL: https://mockupstream:9090
      OPENAI_BASE_URL: https://mockupstream:9090/v1
      SENTINEL_UPSTREAM_MOCKCOMPAT_PROTOCOL: openai
      SENTINEL_UPSTREAM_MOCKCOMPAT_BASE_URL: https://mockupstream:9090/v1
      SENTINEL_UPSTREAM_CA_FILE: /certs/ca.pem
      # The mock ignores the upstream keys, so keep the real ones from .env
      # away from it.
      ANTHROPIC_API_KEY: mock-not-a-real-key
      OPENAI_API_KEY: mock-not-a-real-key
      SENTINEL_UPSTREAM_MOCKCOMPAT_API_KEY: mock-not-a-real-key
      # Client keys come from the postgres service, issued and revoked
      # through the admin API below; the gateway fetches them every 30 s
      # (SENTINEL_KEYS_REFRESH, settable in .env). The password is the
      # service's dev-only one (docker-compose.yml).
      SENTINEL_DATABASE_URL: postgres://sentinel:sentinel-dev-only@postgres:5432/sentinel?sslmode=disable
      # Empty, so a SENTINEL_API_KEYS in .env (for make up-real) doesn't
      # stop startup: the gateway refuses keys from both places.
      SENTINEL_API_KEYS: ""
      # The admin API on all interfaces inside the container; the host port
      # below is bound to loopback only.
      SENTINEL_ADMIN_ADDR: 0.0.0.0:9465
      # From .env, never defaulted: generate one with openssl rand -hex 32.
      SENTINEL_ADMIN_TOKEN: ${SENTINEL_ADMIN_TOKEN:?set SENTINEL_ADMIN_TOKEN in .env, for example to the output of openssl rand -hex 32 (see .env.example)}
    ports:
      - "127.0.0.1:9465:9465"
    # Only the CA certificate; the server key stays with mockupstream.
    volumes:
      - type: bind
        source: ./certs/ca.pem
        target: /certs/ca.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      mockupstream:
        condition: service_started
      postgres:
        condition: service_healthy
